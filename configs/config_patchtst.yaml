defaults:
  - dataset: cer
  - model: patchtst
  - train: default
  - _self_

device: cuda
seed: 42
n_samples: 50000   # training windows drawn per epoch-equivalent

output_dir: "."

hydra:
  run:
    dir: outputs/patchtst/${dataset.name}/ctx${dataset.context_length}_h${dataset.prediction_length}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/patchtst/${dataset.name}/multirun
    subdir: ctx${dataset.context_length}_h${dataset.prediction_length}

eval:
  run_dir: /home/d32485/forecasting_benchmark/outputs/patchtst/cer_bis/ctx512_h96/2026-07-03_16-00-06            # chemin du dossier de training à évaluer
  checkpoint: best_model.pth