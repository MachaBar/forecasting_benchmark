defaults:
  - dataset: cer_bis
  - model: statistical
  - _self_

output_dir: "outputs/statistical"

hydra:
  run:
    dir: outputs/statistical/${dataset.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/statistical/${dataset.name}/multirun_${now:%Y-%m-%d_%H-%M-%S}
    subdir: ctx${dataset.context_length}_h${dataset.prediction_length}