defaults:
  - dataset: cer_bis
  - model: lgbm
  - _self_

output_dir: "."
hydra:
  run:
    dir: outputs/lgbm/${dataset.name}/ctx${dataset.context_length}_h${dataset.prediction_length}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/lgbm/${dataset.name}/multirun
    subdir: ctx${dataset.context_length}_h${dataset.prediction_length}